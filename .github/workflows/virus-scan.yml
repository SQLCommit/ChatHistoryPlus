# Virus scan. Run it by hand (Actions > Virus scan > Run workflow) with a release tag, after Prepare release has
# attached the zip. It downloads the release's zip files, checks them against SHA256SUMS.txt, sends each one to
# VirusTotal, waits for the result, and adds a "Virus scan" section at the end of the release notes with the count and
# a link to the full report. It works on a draft or a published release and changes nothing else.
# Needs a repository secret VT_API_KEY (a free VirusTotal account's API key). Running Prepare release again removes
# this section, because the zip may have changed; run Virus scan again after it.
name: Virus scan
run-name: Virus scan ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to scan (for example v1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: virus-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scan the release files and add the result to the notes
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VT_API_KEY) { throw 'Add your VirusTotal API key as a repository secret named VT_API_KEY (Settings > Secrets and variables > Actions).' }
          $marker = '<!-- virus scan: generated below this line -->'
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }

          $info = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body,assets 2>&1
          if ($LASTEXITCODE) { throw "No release with tag $env:TAG was found. ($info)" }
          $release = ($info -join "`n") | ConvertFrom-Json
          $zips = @($release.assets | Where-Object { $_.name -like '*.zip' } | ForEach-Object { $_.name })
          if (-not $zips) { throw "$env:TAG has no zip to scan. Run Prepare release first." }

          $dir = Join-Path $env:RUNNER_TEMP 'scan'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir --pattern '*.zip' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE) { throw "Could not download the files of $env:TAG." }
          $sumsFile = Join-Path $dir 'SHA256SUMS.txt'
          $sums = @{}
          if (Test-Path -LiteralPath $sumsFile) {
            foreach ($line in Get-Content -LiteralPath $sumsFile) { if ($line -match '^([0-9a-f]{64})\s+\*?(.+)$') { $sums[$Matches[2].Trim()] = $Matches[1] } }
          }

          $lines = @($marker, '### Virus scan', '')
          foreach ($zip in $zips) {
            $path = Join-Path $dir $zip
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sums.ContainsKey($zip) -and $sums[$zip] -ne $sha) { throw "$zip does not match SHA256SUMS.txt; not scanning it." }
            if ((Get-Item -LiteralPath $path).Length -gt 32MB) { throw "$zip is over 32 MB, VirusTotal's limit for a direct upload." }

            Write-Host "Sending $zip ($sha) to VirusTotal..."
            $upload = Invoke-RestMethod -Uri 'https://www.virustotal.com/api/v3/files' -Method Post -Headers $headers -Form @{ file = Get-Item -LiteralPath $path }
            $id = $upload.data.id
            # The free API allows 4 requests a minute, so check every 30 seconds, for up to 15 minutes.
            $deadline = (Get-Date).AddMinutes(15)
            do {
              Start-Sleep -Seconds 30
              $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$id" -Headers $headers
              $status = $analysis.data.attributes.status
              Write-Host "  $status"
            } while ($status -ne 'completed' -and (Get-Date) -lt $deadline)
            if ($status -ne 'completed') { throw "VirusTotal had not finished $zip after 15 minutes; run Virus scan again later." }

            $stats = $analysis.data.attributes.stats
            $flagged = [int]$stats.malicious
            $suspicious = [int]$stats.suspicious
            $engines = $flagged + $suspicious + [int]$stats.undetected + [int]$stats.harmless
            $report = "https://www.virustotal.com/gui/file/$sha"
            $when = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
            $result = if ($flagged -eq 0 -and $suspicious -eq 0) { "0 of $engines antivirus engines flagged it" } else { "$flagged of $engines antivirus engines flagged it as malicious and $suspicious as suspicious" }
            $lines += "- **$zip**: $result on VirusTotal ([full report]($report)), scanned $when."
            $summary = "${zip}: $result. Report: $report"
            Write-Host $summary
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          }

          # Keep everything above an earlier scan's section (your notes and the Downloads section) and replace the scan.
          $body = "$($release.body)"
          $at = $body.IndexOf($marker)
          if ($at -ge 0) { $body = $body.Substring(0, $at) }
          $body = $body.TrimEnd()
          $notes = if ($body) { "$body`n`n$($lines -join "`n")`n" } else { "$($lines -join "`n")`n" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file $notesFile | Out-Null
          if ($LASTEXITCODE) { throw "The scan finished (see the summary) but the release notes could not be edited; paste the report link into them by hand." }
